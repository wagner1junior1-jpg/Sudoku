<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded App Icon -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Outer Sudoku Block Border -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="#152140" stroke="#3b82f6" stroke-width="10"/>
  
  <!-- 3x3 Grid Lines -->
  <line x1="196" y1="76" x2="196" y2="436" stroke="#60a5fa" stroke-width="8"/>
  <line x1="316" y1="76" x2="316" y2="436" stroke="#60a5fa" stroke-width="8"/>
  <line x1="76" y1="196" x2="436" y2="196" stroke="#60a5fa" stroke-width="8"/>
  <line x1="76" y1="316" x2="436" y2="316" stroke="#60a5fa" stroke-width="8"/>
  
  <!-- Highlighted Center Tile -->
  <rect x="202" y="202" width="108" height="108" rx="16" fill="url(#accent)"/>
  
  <!-- Digits -->
  <text x="136" y="160" font-family="sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
  <text x="376" y="160" font-family="sans-serif" font-size="64" font-weight="900" fill="#93c5fd" text-anchor="middle">3</text>
  <text x="256" y="280" font-family="sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle">9</text>
  <text x="136" y="400" font-family="sans-serif" font-size="64" font-weight="900" fill="#93c5fd" text-anchor="middle">7</text>
  <text x="376" y="400" font-family="sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
</svg>
