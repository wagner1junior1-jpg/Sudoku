<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c38"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#070c1a"/>
    </linearGradient>
    <linearGradient id="splashTileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="splashShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="2732" height="2732" fill="url(#splashBg)"/>

  <!-- Centered App Icon Badge -->
  <g transform="translate(1366, 1200)" filter="url(#splashShadow)">
    <g transform="translate(-400, -400)">
      <!-- Card Board -->
      <rect width="800" height="800" rx="90" fill="#152140" stroke="#3b82f6" stroke-width="20"/>
      
      <!-- Major 3x3 Grid Lines -->
      <line x1="266" y1="0" x2="266" y2="800" stroke="#60a5fa" stroke-width="16" stroke-linecap="round"/>
      <line x1="534" y1="0" x2="534" y2="800" stroke="#60a5fa" stroke-width="16" stroke-linecap="round"/>
      <line x1="0" y1="266" x2="800" y2="266" stroke="#60a5fa" stroke-width="16" stroke-linecap="round"/>
      <line x1="0" y1="534" x2="800" y2="534" stroke="#60a5fa" stroke-width="16" stroke-linecap="round"/>
      
      <!-- Glowing Center Active Cell -->
      <rect x="276" y="276" width="248" height="248" rx="36" fill="url(#splashTileGrad)" stroke="#93c5fd" stroke-width="8"/>
      
      <!-- Digits -->
      <text x="133" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="150" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
      <text x="667" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="150" font-weight="900" fill="#93c5fd" text-anchor="middle" dominant-baseline="central">3</text>
      <text x="400" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="180" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">9</text>
      <text x="133" y="667" font-family="system-ui, -apple-system, sans-serif" font-size="150" font-weight="900" fill="#93c5fd" text-anchor="middle" dominant-baseline="central">7</text>
      <text x="667" y="667" font-family="system-ui, -apple-system, sans-serif" font-size="150" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    </g>
  </g>

  <!-- Title & Subtitle -->
  <text x="1366" y="1820" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="900" letter-spacing="8" fill="#ffffff" text-anchor="middle">SUDOKU MASTER PRO</text>
  <text x="1366" y="1930" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" letter-spacing="12" fill="#60a5fa" text-anchor="middle">100% OFFLINE &amp; SEM ANÚNCIOS</text>
</svg>
