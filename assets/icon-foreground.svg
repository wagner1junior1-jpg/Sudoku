<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Centered Grid Container with shadow -->
  <g filter="url(#shadow)">
    <!-- Outer Card Board -->
    <rect x="232" y="232" width="560" height="560" rx="56" fill="#152140" stroke="#3b82f6" stroke-width="14"/>
    
    <!-- Major 3x3 Grid Lines -->
    <line x1="418" y1="232" x2="418" y2="792" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
    <line x1="604" y1="232" x2="604" y2="792" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
    <line x1="232" y1="418" x2="792" y2="418" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
    <line x1="232" y1="604" x2="792" y2="604" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Glowing Center Active Cell -->
    <rect x="428" y="428" width="166" height="166" rx="24" fill="url(#tileGrad)" stroke="#93c5fd" stroke-width="6"/>
    
    <!-- Bold Sudoku Digits -->
    <text x="325" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="105" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    <text x="698" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="105" font-weight="900" fill="#93c5fd" text-anchor="middle" dominant-baseline="central">3</text>
    <text x="512" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="125" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">9</text>
    <text x="325" y="698" font-family="system-ui, -apple-system, sans-serif" font-size="105" font-weight="900" fill="#93c5fd" text-anchor="middle" dominant-baseline="central">7</text>
    <text x="698" y="698" font-family="system-ui, -apple-system, sans-serif" font-size="105" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  </g>
</svg>
