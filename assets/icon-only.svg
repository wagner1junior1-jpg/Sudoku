<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="tileGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadowFull" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" rx="230" fill="url(#bgGradFull)"/>

  <!-- Centered Grid Container with shadow -->
  <g filter="url(#shadowFull)">
    <!-- Outer Card Board -->
    <rect x="192" y="192" width="640" height="640" rx="64" fill="#152140" stroke="#3b82f6" stroke-width="16"/>
    
    <!-- Major 3x3 Grid Lines -->
    <line x1="405" y1="192" x2="405" y2="832" stroke="#60a5fa" stroke-width="14" stroke-linecap="round"/>
    <line x1="619" y1="192" x2="619" y2="832" stroke="#60a5fa" stroke-width="14" stroke-linecap="round"/>
    <line x1="192" y1="405" x2="832" y2="405" stroke="#60a5fa" stroke-width="14" stroke-linecap="round"/>
    <line x1="192" y1="619" x2="832" y2="619" stroke="#60a5fa" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Glowing Center Active Cell -->
    <rect x="417" y="417" width="190" height="190" rx="28" fill="url(#tileGradFull)" stroke="#93c5fd" stroke-width="6"/>
    
    <!-- Bold Sudoku Digits -->
    <text x="298" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    <text x="725" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="900" fill="#93c5fd" text-anchor="middle" dominant-baseline="central">3</text>
    <text x="512" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">9</text>
    <text x="298" y="725" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="900" fill="#93c5fd" text-anchor="middle" dominant-baseline="central">7</text>
    <text x="725" y="725" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  </g>
</svg>
