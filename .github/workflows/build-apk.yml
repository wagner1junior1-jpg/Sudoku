name: Build Android APK (Sudoku Master Pro)

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm install

      - name: ⚡ Compilar Aplicação Web (Vite)
        run: npm run build

      - name: 🔄 Sincronizar com Capacitor Android
        run: npx cap sync android

      - name: 🔑 Permissões para o Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🔨 Compilar APK Debug (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📋 Renomear APK para nome amigável
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Sudoku-Master-Pro.apk

      - name: 📤 Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-Master-Pro-APK
          path: build-output/Sudoku-Master-Pro.apk
          retention-days: 30
